<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAR Locator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --open: #1e9e3a; --closed: #d32f2f; --spar: #e30613; --bar: #ffffff; --text: #1d1d1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  body { display: flex; flex-direction: column; background: #f4f4f4; }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--bar); border-bottom: 3px solid var(--spar);
    z-index: 1000; box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  h1 { margin: 0; font-size: 18px; font-weight: 800; color: var(--spar); letter-spacing: .02em; }
  select { font: inherit; font-size: 16px; padding: 6px 10px; border: 1px solid #bbb; border-radius: 6px; background: #fff; min-width: 200px; max-width: 100%; }
  .legend { display: flex; gap: 14px; font-size: 14px; margin-left: auto; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
  .dot.open { background: var(--open); } .dot.closed { background: var(--closed); }
  #clock { font-size: 13px; color: #666; white-space: nowrap; }
  #map { flex: 1; }

  /* Opening-hours label above each store */
  .leaflet-tooltip.hours {
    padding: 1px 5px; font-size: 12px; font-weight: 700; line-height: 1.3;
    border-radius: 4px; border: none; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .leaflet-tooltip.hours.open { background: var(--open); }
  .leaflet-tooltip.hours.closed { background: var(--closed); }
  .leaflet-tooltip-top.hours.open::before { border-top-color: var(--open); }
  .leaflet-tooltip-top.hours.closed::before { border-top-color: var(--closed); }
  #map.hide-labels .leaflet-tooltip.hours { display: none; }

  .popup h3 { margin: 0 0 2px; font-size: 14px; }
  .popup .addr { color: #555; margin-bottom: 6px; }
  .popup table { border-collapse: collapse; font-size: 12px; }
  .popup td { padding: 1px 8px 1px 0; }
  .popup tr.today td { font-weight: 700; }
  .popup .note { color: var(--closed); font-weight: 600; margin: 4px 0; }
  .popup a { color: var(--spar); }

  @media (max-width: 600px) {
    header { gap: 8px; }
    select { flex: 1; min-width: 0; }
    .legend { margin-left: 0; width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>
<header>
  <h1>SPAR Locator</h1>
  <select id="city" aria-label="City"><option>Loading…</option></select>
  <div class="legend">
    <span><i class="dot open"></i>Open</span>
    <span><i class="dot closed"></i>Closed</span>
    <span id="clock"></span>
  </div>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const TZ = "Europe/Zagreb";
const ALL = "__all__";
const LABEL_MIN_ZOOM = 11;
const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

const map = L.map("map", { zoomControl: true }).setView([44.6, 16.4], 7);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · Store data: spar.hr',
}).addTo(map);

let stores = [];
const markers = [];

// ---- time helpers (always Croatian local time, wherever the viewer is) ----
function zagrebNow() {
  const parts = Object.fromEntries(
    new Intl.DateTimeFormat("en-CA", {
      timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23",
    }).formatToParts(new Date()).map(p => [p.type, p.value])
  );
  return {
    date: `${parts.year}-${parts.month}-${parts.day}`,
    dow: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].indexOf(parts.weekday), // 0 = Monday
    minutes: (+parts.hour) * 60 + (+parts.minute),
    hhmm: `${parts.hour}:${parts.minute}`,
  };
}

function fmt(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return mm ? `${h}:${String(mm).padStart(2, "0")}` : `${h}`;
}
const fmtIntervals = iv => iv.length ? iv.map(([o, c]) => `${fmt(o)}–${fmt(c)}`).join(", ") : "–";

function hoursFor(store, date, dow) {
  if (store.closed && date >= store.closed.from && date <= store.closed.to) return [];
  if (date in store.special) return store.special[date];
  return store.week[dow] || [];
}

function status(store, now) {
  const today = hoursFor(store, now.date, now.dow);
  const open = today.some(([o, c]) => now.minutes >= o && now.minutes < c);
  return { today, open };
}

// ---- rendering ----
function popupHtml(store, now) {
  const rows = DAY_NAMES.map((d, i) => {
    // Show this week's actual dates so holidays are reflected.
    const dt = new Date(now.date + "T12:00:00Z");
    dt.setUTCDate(dt.getUTCDate() + (i - now.dow));
    const date = dt.toISOString().slice(0, 10);
    return `<tr class="${i === now.dow ? "today" : ""}"><td>${d} ${date.slice(8)}.${date.slice(5, 7)}.</td><td>${fmtIntervals(hoursFor(store, date, i))}</td></tr>`;
  }).join("");
  const note = store.closed && now.date >= store.closed.from && now.date <= store.closed.to
    ? `<div class="note">Temporarily closed${store.closed.info ? " (" + esc(store.closed.info) + ")" : ""} until ${store.closed.to.split("-").reverse().join(".")}.</div>` : "";
  return `<div class="popup"><h3>${esc(store.name)}</h3>
    <div class="addr">${esc(store.address)}, ${esc(store.zip)} ${esc(store.city)}${store.phone ? " · " + esc(store.phone) : ""}</div>
    ${note}<table>${rows}</table>
    ${store.url ? `<div style="margin-top:6px"><a href="${store.url}" target="_blank" rel="noopener">spar.hr ↗</a></div>` : ""}</div>`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function refresh() {
  const now = zagrebNow();
  document.getElementById("clock").textContent = `Zagreb ${now.hhmm}`;
  for (const { store, marker } of markers) {
    const { today, open } = status(store, now);
    const cls = open ? "open" : "closed";
    marker.setStyle({ fillColor: open ? "#1e9e3a" : "#d32f2f" });
    if (open) marker.bringToFront();
    const tip = marker.getTooltip();
    tip.setContent(fmtIntervals(today));
    tip.options.className = `hours ${cls}`;
    const el = tip.getElement();
    if (el) { el.classList.toggle("open", open); el.classList.toggle("closed", !open); }
    if (marker.isPopupOpen()) marker.setPopupContent(popupHtml(store, now));
  }
}

function buildMarkers() {
  for (const store of stores) {
    const marker = L.circleMarker([store.lat, store.lon], {
      radius: store.type === "INTERSPAR" ? 11 : 8,
      color: "#fff", weight: 2, fillOpacity: 0.95, fillColor: "#999",
    }).addTo(map);
    marker.bindTooltip("", { permanent: true, direction: "top", offset: [0, -8], className: "hours", opacity: 1 });
    marker.bindPopup(() => popupHtml(store, zagrebNow()));
    markers.push({ store, marker });
  }
  refresh();
}

function buildCitySelect() {
  const counts = {};
  for (const s of stores) counts[s.city] = (counts[s.city] || 0) + 1;
  const sel = document.getElementById("city");
  const cities = Object.keys(counts).sort((a, b) => a.localeCompare(b, "hr"));
  sel.innerHTML = `<option value="${ALL}">All of Croatia (${stores.length})</option>` +
    cities.map(c => `<option value="${esc(c)}">${esc(c)} (${counts[c]})</option>`).join("");
  let saved = null;
  try { saved = localStorage.getItem("spar.city"); } catch (e) {}
  sel.value = saved && counts[saved] ? saved : ALL;
  sel.addEventListener("change", () => {
    try { localStorage.setItem("spar.city", sel.value); } catch (e) {}
    showCity(sel.value);
  });
  showCity(sel.value);
}

function showCity(city) {
  if (city === ALL) {
    map.fitBounds(L.latLngBounds(stores.map(s => [s.lat, s.lon])), { padding: [30, 30] });
    return;
  }
  const pts = stores.filter(s => s.city === city).map(s => [s.lat, s.lon]);
  if (pts.length === 1) map.setView(pts[0], 15);
  else map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 15 });
}

function updateLabelVisibility() {
  document.getElementById("map").classList.toggle("hide-labels", map.getZoom() < LABEL_MIN_ZOOM);
}
map.on("zoomend", updateLabelVisibility);

fetch("data/stores.json")
  .then(r => r.json())
  .then(data => {
    stores = data;
    buildMarkers();
    buildCitySelect();
    updateLabelVisibility();
    setInterval(refresh, 30 * 1000);
  })
  .catch(err => {
    document.getElementById("city").innerHTML = "<option>Could not load stores</option>";
    console.error(err);
  });
</script>
</body>
</html>
