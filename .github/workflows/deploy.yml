name: Publish site

# Publishes the map to GitHub Pages on every push, and once a day refreshes
# the store data from spar.hr first (committing it if anything changed).
on:
  push:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh store data from spar.hr
        if: github.event_name != 'push'
        # If spar.hr blocks the request, keep publishing the last saved data.
        continue-on-error: true
        run: |
          python3 scripts/fetch_stores.py
          if git diff --quiet data/stores.json; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh store data"
          git push

      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/stores.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
