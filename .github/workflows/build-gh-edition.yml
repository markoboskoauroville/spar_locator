# THE GITHUB BUILDS: "Spar GH" (com.mantra.spar.gh) and "DM Finder" (com.mantra.dmfinder.gh), built
# and signed here, beside the Mac's Spar Locator.
#
# Marko, 2.11.2026: "make a workflow on GitHub and build it there with different signature. It's
# okay. I will have 2 different apps." and, the same morning, "make another application called DM
# Finder ... put it in the same repository and have the same workflow ... on the releases page you
# put Spar separately, DM separately."
#
# One key, GitHub's own and permanent (secrets SPAR_GH_KEYSTORE and SPAR_GH_KEYSTORE_PASSWORD, a
# PKCS12 with alias "spar"), so every build installs over the last of the same app. Releases:
# spar-gh-vN (appVersion) and dm-vN (dmVersion), never --latest (the Mac's vN stays "latest"); two
# of each are kept. Action SHAs are the ones build-apk.yml pins.

name: Build Spar GH and DM Finder

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle.properties'
      - '.github/workflows/build-gh-edition.yml'

permissions:
  contents: write

concurrency:
  group: gh-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Versions
        id: v
        run: |
          num() { grep -E "^$1=" gradle.properties | cut -d= -f2 | tr -d '[:space:]'; }
          S=$(num appVersion); D=$(num dmVersion)
          for x in "$S" "$D"; do case "$x" in ''|*[!0-9]*) echo "a version is not a whole number"; exit 1;; esac; done
          echo "spar=$S" >> "$GITHUB_OUTPUT"; echo "dm=$D" >> "$GITHUB_OUTPUT"
          echo "Spar v$S, DM Finder v$D, commit $(git rev-parse --short HEAD)"

      - name: Structural checks
        run: python3 scripts/verify.py

      - name: Test 1 — the mechanism (Spar's and dm's answers)
        run: ./gradlew :app:testSparReleaseUnitTest --no-daemon

      - name: Lint, both apps
        run: ./gradlew :app:lintSparRelease :app:lintDmRelease --no-daemon

      - name: Restore GitHub's key
        env:
          KS: ${{ secrets.SPAR_GH_KEYSTORE }}
          KS_PW: ${{ secrets.SPAR_GH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KS" ] || { echo "SPAR_GH_KEYSTORE is not set"; exit 1; }
          echo "$KS" | base64 -d > spar-gh.p12
          printf 'storeFile=spar-gh.p12\nstorePassword=%s\nkeyAlias=spar\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties

      - name: Build both
        run: ./gradlew :app:assembleSparRelease :app:assembleDmRelease -PghBuild=true --no-daemon

      - name: Check and publish
        env:
          GH_TOKEN: ${{ github.token }}
          SV: ${{ steps.v.outputs.spar }}
          DV: ${{ steps.v.outputs.dm }}
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          SHA=$(git rev-parse --short HEAD)
          one() {  # flavour id version tag title file
            local flavour=$1 id=$2 v=$3 tag=$4 title=$5 out=$6 apk badge hits note
            apk=$(find "app/build/outputs/apk/$flavour/release" -name '*.apk' | head -1)
            badge=$("$AAPT" dump badging "$apk")
            echo "$badge" | grep -E "^package:|application-label:"
            echo "$badge" | grep -q "name='$id'"
            echo "$badge" | grep -q "versionCode='$v'"
            "$APKSIGNER" verify "$apk"
            hits=$(strings -a "$apk" | grep -acE '(AQ\.|gsk_|AIza|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
            [ "$hits" = "0" ] || { echo "a key-shaped string is in $apk"; exit 1; }
            cp "$apk" "$out"
            note="$title: built by GitHub (id $id, GitHub's own key). Build ${GITHUB_RUN_NUMBER} from $SHA."
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$out" --clobber
              gh release edit "$tag" --notes "$note"
            else
              gh release create "$tag" "$out" --title "$title" --notes "$note" --latest=false
            fi
            echo "### $title: [${out}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${out})" >> "$GITHUB_STEP_SUMMARY"
            gh release list --limit 200 --json tagName,createdAt \
              --jq "[.[] | select(.tagName | startswith(\"${tag%v*}v\"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName" |
              while read -r t; do [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag && echo "removed $t"; done
          }
          one spar com.mantra.spar.gh "$SV" "spar-gh-v$SV" "Spar GH v$SV" "spar-gh-v$SV.apk"
          one dm com.mantra.dmfinder.gh "$DV" "dm-v$DV" "DM Finder v$DV" "dm-finder-v$DV.apk"
