# THE GITHUB EDITION: "Spar GH" (com.mantra.spar.gh), built and signed here, beside the Mac's build.
#
# Marko, 2.11.2026: "make a workflow on GitHub and build it there with different signature. It's
# okay. I will have 2 different apps." The id differs, so it never collides with the Mac's
# com.mantra.spar; the key is GitHub's own and permanent (secrets SPAR_GH_KEYSTORE and
# SPAR_GH_KEYSTORE_PASSWORD, a PKCS12 with alias "spar"), so every GitHub build installs over the
# last. Releases are tagged gh-vN, never --latest (the Mac's vN stays "latest"); two are kept.
# Action SHAs are the ones build-apk.yml pins.

name: Build Spar GH

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle.properties'
      - '.github/workflows/build-gh-edition.yml'

permissions:
  contents: write

concurrency:
  group: gh-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Version
        id: v
        run: |
          V=$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          case "$V" in ''|*[!0-9]*) echo "appVersion is not a whole number"; exit 1;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version $V, commit $(git rev-parse --short HEAD)"

      - name: Structural checks
        run: python3 scripts/verify.py

      - name: Test 1 — the mechanism
        run: ./gradlew :app:testReleaseUnitTest --no-daemon

      - name: Lint (the Mac's configuration, exactly as it ships)
        run: ./gradlew :app:lintRelease --no-daemon

      - name: Restore GitHub's key
        env:
          KS: ${{ secrets.SPAR_GH_KEYSTORE }}
          KS_PW: ${{ secrets.SPAR_GH_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KS" ] || { echo "SPAR_GH_KEYSTORE is not set"; exit 1; }
          echo "$KS" | base64 -d > spar-gh.p12
          printf 'storeFile=spar-gh.p12\nstorePassword=%s\nkeyAlias=spar\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties

      - name: Build Spar GH
        run: ./gradlew :app:assembleRelease -PghBuild=true --no-daemon

      - name: Check the APK
        id: apk
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          BADGE=$("$AAPT" dump badging "$APK")
          echo "$BADGE" | grep -E "^package:|application-label:"
          echo "$BADGE" | grep -q "name='com.mantra.spar.gh'"
          echo "$BADGE" | grep -q "versionCode='$V'"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -3
          HITS=$(strings -a "$APK" | grep -acE '(AQ\.|gsk_|AIza|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
          [ "$HITS" = "0" ] || { echo "a key-shaped string is in the APK"; exit 1; }
          OUT="spar-gh-v${V}.apk"
          cp "$APK" "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish gh-vN
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
          OUT: ${{ steps.apk.outputs.out }}
        run: |
          set -euo pipefail
          TAG="gh-v${V}"
          NOTE="Spar GH v${V}: the GitHub edition (com.mantra.spar.gh, GitHub's own key), installs beside the Mac's Spar Locator. Build ${GITHUB_RUN_NUMBER} from $(git rev-parse --short HEAD)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version rebuilt (a fix without a bump): the file is replaced, so the link stays.
            gh release upload "$TAG" "$OUT" --clobber
            gh release edit "$TAG" --notes "$NOTE"
          else
            gh release create "$TAG" "$OUT" --title "Spar GH v${V}" --notes "$NOTE" --latest=false
          fi
          echo "### Download: [${OUT}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OUT})" >> "$GITHUB_STEP_SUMMARY"
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("gh-v"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read -r t; do
            [ -n "$t" ] && gh release delete "$t" --yes --cleanup-tag && echo "removed $t"
          done
