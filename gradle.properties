# THE VERSION, AND IT IS THE ONLY PLACE IT IS WRITTEN.
#
# MANTRA_MANIFEST/modules/versioning.md: one whole number per app, no dots. app/build.gradle.kts
# turns it into versionCode, versionName and the digits under the launcher icon, and the workflow
# reads this same line for the file name and the release tag. Every change is a new number.
appVersion=3

# DM Finder (the dm flavour), its own whole number.
dmVersion=1

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
